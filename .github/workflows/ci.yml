name: CI

on:
  push:
  pull_request:

# a newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (H2 + embedded Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        env:
          JDK21_HOME: ${{ env.JAVA_HOME }}   # the toolchain gradle.properties looks for (setup-java sets JAVA_HOME)
        run: ./gradlew test --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

  test-es:
    name: test with Elasticsearch
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 60); do
            curl -fs "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" && exit 0
            sleep 2
          done
          echo "elasticsearch did not come up" >&2
          exit 1
      - name: Test (including the live-Elasticsearch tests)
        env:
          JDK21_HOME: ${{ env.JAVA_HOME }}
        run: ./gradlew test -Pes=true --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-es
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
