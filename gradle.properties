# NOTE: ~/.gradle/gradle.properties (user level) OVERRIDES project properties. It pins the Gradle daemon to JDK 17
# for other projects. That is fine: the daemon may run on 17, the code compiles and tests on the JDK 21 toolchain below.
# The JDK 21 toolchain is found from the JDK21_HOME environment variable, else from JAVA_HOME (the Makefile exports
# JDK21_HOME = JAVA_HOME; CI sets both from setup-java), so no machine path is written here.
org.gradle.java.installations.fromEnv=JDK21_HOME,JAVA_HOME
org.gradle.java.installations.auto-download=false
org.gradle.caching=true
org.gradle.parallel=true
