spring:
  application:
    name: valuation-loop
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/valuation_loop
    username: postgres
    password: ${PG_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches the entities
  flyway:
    enabled: true
    # Pending versions apply in order (V4 drop processed_event, then V5 completion_match), so a database built before
    # either still upgrades in place. Kept false (the default) on purpose: a version older than the database's current
    # one is refused, never slipped in later (docs/DEMO.md "When something is off").
    out-of-order: false
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record             # the offset is committed after the listener method returns without throwing
  threads:
    virtual:
      enabled: true                # Java 21 virtual threads for request handling

valuationloop:
  outbox:
    enabled: true
    relay-delay-ms: 300
    batch-size: 100
  reply-window-hours: 24           # OAV: "reply by end of next working day" (simplified to 24h in v1)
  delivery:
    slow-ms: 2000                  # how long the simulated "slow" CRM adapter takes per call
    flaky-failures: 2              # calls per lead the simulated "flaky" adapter fails before it succeeds
    partitions: 6                  # lead.deliver.v1 and its -retry-0/-retry-1/-dlt (DeliveryTopics creates or grows them)
    concurrency: 3                 # DeliverLead consumer threads (each owns 2 of the 6 partitions)
    adapter-timeout-ms: 5000       # an adapter call slower than this is cut off and counts as a failed attempt
    deadline-scan-ms: 5000         # how often the deadline scanner looks for leads past reply_due_at
    deadline-scanner:
      enabled: true                # off in tests, which drive DeadlineScanner.scanOnce() by hand
    listener:
      auto-startup: true           # the lead.deliver.v1 consumer (and its retry/DLT containers) start with the app
  scorecard:
    listener:
      auto-startup: true           # the scorecard consumer; make replay starts it by hand after truncating
  completion:                      # v2 Land Registry late match (completion/CompletionScanner.java)
    enabled: true                  # off in tests, which call CompletionScanner.scanOnce() by hand
    scan-ms: 60000                 # how often instructed leads are checked for their sale in Price Paid Data
    lookback-days: 30              # a sale counts if transferred on or after (instruction date - this many days)
  outcome:
    # Shared secret the CRM sends in X-Webhook-Token on POST /outcomes/webhook. Demo only: production uses a
    # per-CRM HMAC signature over the body, which also binds the leadRef to the agent whose CRM signed it.
    webhook-token: demo-webhook-token
  es:
    url: http://127.0.0.1:9200     # Elasticsearch for comparables (loopback, security off locally)
  evidence:
    index: comparables-v1          # comparables index the loader writes and the pack builder reads
    centroid-index: postcode-centroids-v1  # postcode -> lat/lon (Code-Point Open centroids)
    radius-m: 1500                 # hard filter: only sales within this distance of the request postcode
    max-age-months: 24             # hard filter: only sales in the last N months
    size: 10                       # comparables per pack, at most
    location-scale-m: 400          # gauss decay: a sale this far away scores 0.5 on location
    date-scale-days: 180           # gauss decay: a sale this old scores 0.5 on recency
    floor-area-scale-m2: 15        # gauss decay on floor-area difference (after the offset)
    floor-area-offset-m2: 5        # floor-area differences up to this count as a perfect match
    missing-floor-area-weight: 0.5 # a comparable with no floor area ranks below an equal one that has it

# Data loader (dataloader/LoaderProperties.java). Normally run with the "loader" profile: make load / make stats.
loader:
  run: false                       # true: load PPD + Code-Point + EPC-derived attributes into Elasticsearch
  recreate: false                  # true: drop and recreate both indices first
  stats: false                     # true: print the comparables-range width statistic (the README's number)
  ppd-files:                       # Land Registry Price Paid yearly files, oldest first (paths relative to the repo)
    - ../data-raw/ppd/pp-2024.csv
    - ../data-raw/ppd/pp-2025.csv
    - ../data-raw/ppd/pp-2026.csv
  codepoint-zip: ../data-raw/codepoint/codepo_gb.zip   # OS Code-Point Open
  codepoint-areas: [sw, se]        # postcode areas to load centroids for
  epc-file: ../data-raw/epc/epc-wandsworth-lambeth.csv # EPC certificates pre-filtered to the two boroughs
  epc:
    # The EPC register limits address use to energy-performance purposes. This demo uses EPC addresses only in
    # memory to join floor area to sales. false: the EPC file is skipped, property type comes from PPD only.
    enabled: true
  districts: [WANDSWORTH, LAMBETH] # PPD district values to keep
  bulk-size: 1000                  # documents per Elasticsearch bulk request
  stats-outcodes: [SW11, SW4, SW12, SW18, SW2, SW9, SE24, SE11]  # outcodes the range-width sample is drawn from
  stats-sample: 400                # pseudo-requests in the statistic
  stats-seed: 42                   # shuffle seed, so the number is reproducible

server:
  address: 127.0.0.1               # local demo: the API is not exposed beyond this machine

management:
  server:
    address: 127.0.0.1
    port: 8081                     # actuator on its own loopback port, apart from the API
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    uk.valuationloop: INFO
    org.apache.kafka: WARN
